name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test Source/MobiMetadata.Tests/MobiMetadata.Tests.csproj -c Release --filter "FullyQualifiedName~RegressionTests|FullyQualifiedName~PageRecordBoundaryTests"

      - run: dotnet pack Source/MobiMetadata/MobiMetadata.csproj -c Release -o ./nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: Meyn

      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
